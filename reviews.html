    <a href="index.html" class="logo">🏠 E-Vumi <span>Seba</span></a>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="navMenu">
      <a href="index.html">হোম</a>
      <a href="services.html">সেবা</a>
      <a href="about.html">আমাদের সম্পর্কে</a>
      <a href="reviews.html">রিভিউ</a>
      <a href="questions.html">প্রশ্ন</a>
      <a href="contact.html">যোগাযোগ</a>
      <a href="status.html" class="nav-btn">🔎 স্ট্যাটাস</a>
    </nav>
  </div>
</header>

<main class="page-wrap">

<section class="page-header">
  <div class="container">
    <a href="index.html" class="back-link">← হোমে ফিরুন</a>
    <h1>💬 কাস্টমার রিভিউ</h1>
    <p>আপনার অভিজ্ঞতা শেয়ার করুন — সবাই দেখতে পারবে</p>
  </div>
</section>

<section class="section">
  <div class="container">

    <!-- ADD REVIEW FORM -->
    <div class="add-review-box">
      <h3>⭐ আপনার রিভিউ দিন</h3>
      <form id="reviewForm">
        <div class="form-row">
          <label>আপনার নাম *
            <input id="rName" required type="text" placeholder="আপনার নাম">
          </label>
          <label>স্থান (ঐচ্ছিক)
            <input id="rLocation" type="text" placeholder="জেলা / এলাকা">
          </label>
        </div>
        <label>রেটিং * (তারা ক্লিক করুন)
          <div class="star-input" id="starInput">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
          </div>
          <input type="hidden" id="rRating" value="5">
        </label>
        <label>আপনার অভিজ্ঞতা *
          <textarea id="rText" required rows="3" placeholder="আমাদের সেবা সম্পর্কে আপনার অভিজ্ঞতা লিখুন..."></textarea>
        </label>
        <button class="btn primary full" type="submit">📤 রিভিউ পাঠান</button>
        <p id="rMessage" class="form-message"></p>
      </form>
    </div>

    <!-- SUMMARY -->
    <div class="review-summary">
      <div class="rating-big">
        <h2 id="avgRating">৪.৯</h2>
        <div class="stars" id="avgStars">⭐⭐⭐⭐⭐</div>
        <p><span id="totalReviews">০</span> রিভিউ থেকে</p>
      </div>
      <div class="rating-bars" id="ratingBars"></div>
    </div>

    <!-- REVIEWS LIST -->
    <h3 style="color:var(--primary-dark);margin:30px 0 18px;font-size:20px;">
      📋 সব রিভিউ (<span id="rCount">0</span>)
    </h3>
    <div id="reviewsList" class="review-grid">
      <p style="text-align:center;color:var(--muted);padding:20px;grid-column:1/-1;">⏳ লোড হচ্ছে...</p>
    </div>

  </div>
</section>

</main>

<footer>
  <div class="container footer-simple">
    <p>© <span id="year"></span> E-Vumi Seba</p>
  </div>
</footer>

</body>
</html>
